[project]
name = "qwen-voice-clone-webui"
version = "0.1.0"
description = "Qwen3-TTS Voice Clone WebUI - Clone voices from YouTube/microphone and generate TTS speech"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
authors = [
    { name = "Shuichi" },
]
keywords = ["tts", "voice-clone", "qwen3-tts", "gradio"]

dependencies = [
    "qwen-tts",
    "gradio>=6.0",
    "pywhispercpp",
    "yt-dlp",
    "soundfile",
    "numpy<2",
    "torch",
    "huggingface-hub[cli]",
]

[project.urls]
Repository = "https://github.com/Shuichi346/qwen-voice-clone-webui"

[project.scripts]
voice-clone-webui = "voice_clone_webui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_clone_webui"]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
