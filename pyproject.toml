[project]
name = "omnivoice-clone-webui"
version = "0.1.0"
description = "OmniVoice Voice Clone WebUI - Clone voices from YouTube/microphone and generate speech"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [
    { name = "Shuichi" },
]
keywords = ["tts", "voice-clone", "omnivoice", "gradio"]

dependencies = [
    "omnivoice>=0.2.1,<0.3",
    "transformers>=5.3,<6",
    "gradio>=6.0,<7",
    "pywhispercpp",
    "yt-dlp",
    "soundfile",
    "numpy>=2.1,<3",
    "torch",
    "huggingface-hub",
]

[project.urls]
Repository = "https://github.com/Shuichi346/omnivoice-voice-clone-webui"

[project.scripts]
voice-clone-webui = "voice_clone_webui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_clone_webui"]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = ["ruff>=0.15,<0.16"]

[tool.ruff]
target-version = "py313"
